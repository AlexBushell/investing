[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "msft-valuation-model-backend"
version = "0.1.0"
description = "Backend for the Microsoft probabilistic valuation model"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.2,<9"
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
