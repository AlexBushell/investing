use_default_settings: true

server:
  # Supply the real value at deploy time with SEARXNG_SECRET.
  secret_key: "set-via-searxng-secret-env"
  bind_address: "0.0.0.0"
  port: 8080
  public_instance: false

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json

ui:
  static_use_hash: true
