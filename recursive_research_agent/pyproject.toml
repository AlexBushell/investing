[project]
name = "recursive-research-agent"
version = "0.1.0"
description = "A recursive adversarial research system backend."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10",
]

[project.scripts]
research = "app.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "outputs*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"
